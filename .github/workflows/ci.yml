name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  prepare-capture-smoke:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: echo 'matrix={"include":[{"runtime":"node20","flavor":"fast"},{"runtime":"node22","flavor":"safe"}]}' >> "$GITHUB_OUTPUT"

  capture-smoke:
    needs: prepare-capture-smoke
    name: opaque runtime cell
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare-capture-smoke.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Capture MatrixTrim runtime evidence
        uses: ./
        with:
          mode: capture
          matrix: ${{ toJSON(matrix) }}
      - run: echo "runtime=${{ matrix.runtime }} flavor=${{ matrix.flavor }}"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run MatrixTrim action against its own CI
        id: matrixtrim
        uses: ./
        with:
          workflow: ci.yml
          limit: "5"
          strength: "2"
          comment: "false"
          create-pr: ${{ github.event_name == 'pull_request' }}
      - name: Verify analysis outputs
        run: |
          test -n "${{ steps.matrixtrim.outputs.failure-events }}"
          test -n "${{ steps.matrixtrim.outputs.multi-event-jobs }}"
          test "${{ steps.matrixtrim.outputs.optimizer-algorithm }}" = "exact-branch-and-bound"
          test "${{ steps.matrixtrim.outputs.optimizer-optimal }}" = "true"
          test -n "${{ steps.matrixtrim.outputs.optimizer-search-nodes }}"
          test "${{ steps.matrixtrim.outputs.constraint-requirements }}" = "1"
          test "${{ steps.matrixtrim.outputs.constraint-coverage }}" = "1.0000"
      - name: Verify PR-trigger safety guard
        if: github.event_name == 'pull_request'
        run: test "${{ steps.matrixtrim.outputs.optimization-pr-status }}" = "skipped"
