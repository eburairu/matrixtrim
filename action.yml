name: MatrixTrim
description: Measure which GitHub Actions matrix jobs add unique failure signal using history, runtime cost, and holdout backtesting.
author: eburairu

branding:
  icon: filter
  color: blue

inputs:
  mode:
    description: analyze runs historical analysis; capture emits deterministic runtime matrix evidence for later analysis.
    required: false
    default: analyze
  matrix:
    description: In capture mode, pass the current matrix as JSON, typically with toJSON(matrix). Do not include sensitive values.
    required: false
  token:
    description: GitHub token used to read Actions history and, when enabled, comment on or create/update draft optimization pull requests.
    required: false
    default: ${{ github.token }}
  workflow:
    description: Workflow file name or ID to analyze. Defaults to the workflow currently running MatrixTrim.
    required: false
  limit:
    description: Number of completed workflow runs to inspect.
    required: false
    default: "100"
  holdout:
    description: Percentage of newer runs reserved for time-based holdout backtesting.
    required: false
    default: "25"
  rolling-folds:
    description: Number of expanding-window temporal validation folds reported alongside the single holdout.
    required: false
    default: "4"
  strength:
    description: Maximum observed combinatorial coverage strength to preserve. 2 means 1-wise + pairwise.
    required: false
    default: "2"
  optimizer:
    description: Optimization mode. auto tries exact branch-and-bound and falls back to greedy when the node budget is exceeded.
    required: false
    default: "auto"
  exact-max-nodes:
    description: Maximum branch-and-bound search nodes before auto falls back or exact mode fails.
    required: false
    default: "250000"
  config:
    description: Repository-relative MatrixTrim config path. Missing default .matrixtrim.yml means no explicit constraints; a missing custom path fails closed.
    required: false
    default: ".matrixtrim.yml"
  comment:
    description: Create or update a MatrixTrim pull-request comment when possible.
    required: false
    default: "true"
  create-pr:
    description: Create or update a draft optimization pull request. Disabled by default and only attempted for fully resolved static matrices.
    required: false
    default: "false"
  allow-diagnostic-pr:
    description: Advanced override that permits diagnostic-only readiness to proceed to existing PR safety checks. Blocked readiness and existing fail-closed rewrite checks cannot be overridden.
    required: false
    default: "false"

outputs:
  capture-status:
    description: captured when mode=capture successfully emitted runtime matrix evidence.
  capture-evidence-candidates:
    description: Number of opted-in unresolved dynamic jobs checked for runtime matrix evidence.
  capture-evidence-jobs:
    description: Number of jobs whose runtime matrix axes were restored from capture evidence.
  capture-evidence-errors:
    description: Number of annotation lookups or conflicting evidence payloads that failed.
  readiness-level:
    description: "Recommendation readiness level: ready, caution, diagnostic-only, or blocked."
  readiness-automation-eligible:
    description: Whether readiness permits automation before the existing detailed rewrite safety checks.
  readiness-reasons:
    description: Comma-separated stable reason codes that downgraded readiness.
  current-cells:
    description: Number of matrix cells observed.
  selected-cells:
    description: Number of cells in the recommendation.
  optimizer-algorithm:
    description: Optimizer that produced the recommendation.
  optimizer-optimal:
    description: "true when exact optimality was proven, false when exact search was attempted but not proven, blank for greedy-only mode."
  optimizer-search-nodes:
    description: Number of exact branch-and-bound nodes explored.
  optimizer-improvement-percent:
    description: Objective-cost improvement over the deterministic greedy baseline.
  optimizer-fallback-reason:
    description: Reason auto mode fell back to greedy, when applicable.
  compute-reduction-percent:
    description: Estimated compute reduction percentage.
  pricing-coverage:
    description: Fraction of matrix cells whose billing classification could be resolved.
  rate-card-usd-per-run-current:
    description: Standard GitHub-hosted runner rate-card equivalent per workflow run before reduction.
  rate-card-usd-per-run-selected:
    description: Standard GitHub-hosted runner rate-card equivalent per workflow run after reduction.
  rate-card-reduction-percent:
    description: Estimated standard-runner rate-card reduction percentage.
  projected-30d-rate-card-usd-current:
    description: Projected 30-day standard-runner rate-card equivalent before reduction.
  projected-30d-rate-card-usd-selected:
    description: Projected 30-day standard-runner rate-card equivalent after reduction.
  repository-visibility:
    description: Repository visibility used for billing interpretation.
  estimated-charge-usd-per-run-current:
    description: Estimated GitHub Actions charge per workflow run before reduction, subject to the billing note.
  estimated-charge-usd-per-run-selected:
    description: Estimated GitHub Actions charge per workflow run after reduction, subject to the billing note.
  estimated-charge-reduction-percent:
    description: Estimated GitHub Actions charge reduction percentage when billable standard-runner pricing is known.
  projected-30d-estimated-charge-usd-current:
    description: Projected 30-day estimated GitHub Actions charge before reduction.
  projected-30d-estimated-charge-usd-selected:
    description: Projected 30-day estimated GitHub Actions charge after reduction.
  historical-recall:
    description: Historical failure recall as a 0-1 ratio.
  failure-events:
    description: Number of extracted failure events across analyzed failed matrix jobs.
  failed-jobs-with-events:
    description: Number of failed matrix jobs that produced at least one analyzable failure event.
  multi-event-jobs:
    description: Number of failed matrix jobs that produced more than one distinct failure event.
  combinatorial-coverage:
    description: Preserved observed combinatorial coverage as a 0-1 ratio.
  constraint-requirements:
    description: Number of explicit hard constraints loaded from the MatrixTrim config.
  constraint-coverage:
    description: Fraction of explicit hard constraints satisfied by the recommendation.
  holdout-recall:
    description: Holdout failure recall as a 0-1 ratio.
  unseen-failure-recall:
    description: Holdout recall for fingerprints unseen in training as a 0-1 ratio.
  rolling-valid-folds:
    description: Number of rolling temporal folds with analyzable holdout failure evidence.
  rolling-holdout-recall:
    description: Aggregate failure recall across valid rolling temporal folds as a 0-1 ratio.
  rolling-worst-holdout-recall:
    description: Worst valid-fold failure recall as a 0-1 ratio.
  rolling-unseen-failure-recall:
    description: Aggregate recall for holdout fingerprints unseen in each fold's training window.
  rolling-selection-stability:
    description: Mean pairwise Jaccard similarity of selected cell sets across valid rolling folds.
  optimization-pr-status:
    description: created, updated, skipped, or disabled.
  optimization-pr-number:
    description: Draft optimization pull-request number when available.
  optimization-pr-url:
    description: Draft optimization pull-request URL when available.
  optimization-pr-reason:
    description: Reason PR creation was skipped when applicable.

runs:
  using: node24
  main: action-dist/index.cjs
